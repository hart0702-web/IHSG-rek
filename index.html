<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Execution Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md space-y-4">
    <!-- Header -->
    <header class="flex justify-between items-center pb-2 border-b border-slate-700">
      <div>
        <h1 class="text-xl font-bold text-white tracking-wide">Stock Assistant</h1>
        <p class="text-xs text-slate-400">Keputusan biner tanpa pusing angka</p>
      </div>
      <!-- Tombol Aktifkan Notifikasi Pop-up -->
      <button id="btnNotif" onclick="enablePush()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-1.5 rounded-lg flex items-center gap-1.5">
        <span id="notifDot" class="w-2 h-2 rounded-full bg-red-500"></span>
        <span id="notifText">Notifikasi: Mati</span>
      </button>
    </header>

    <!-- Form Input Cepat -->
    <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <!-- Pilihan Saham -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">PILIH EMITEN</label>
        <div class="grid grid-cols-4 gap-2">
          <button type="button" onclick="selectTicker('BBCA')" class="ticker-btn py-1.5 text-sm font-semibold rounded bg-blue-600 text-white">BBCA</button>
          <button type="button" onclick="selectTicker('BBRI')" class="ticker-btn py-1.5 text-sm font-semibold rounded bg-slate-700 hover:bg-slate-600">BBRI</button>
          <button type="button" onclick="selectTicker('BMRI')" class="ticker-btn py-1.5 text-sm font-semibold rounded bg-slate-700 hover:bg-slate-600">BMRI</button>
          <button type="button" onclick="selectTicker('BBNI')" class="ticker-btn py-1.5 text-sm font-semibold rounded bg-slate-700 hover:bg-slate-600">BBNI</button>
        </div>
      </div>

      <!-- Area Paste / Drop Gambar -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">SCREENSHOT ORDERBOOK / BROKSUM</label>
        <div id="dropZone" class="border-2 border-dashed border-slate-600 rounded-lg p-5 text-center cursor-pointer hover:border-blue-500 transition-colors bg-slate-850">
          <p class="text-sm font-medium text-slate-300">Tekan <kbd class="px-1.5 py-0.5 bg-slate-750 border border-slate-600 rounded text-xs text-blue-400">Ctrl + V</kbd> untuk Paste</p>
          <p class="text-xs text-slate-500 mt-1">atau klik untuk pilih gambar</p>
          <input type="file" id="fileInput" accept="image/*" class="hidden">
        </div>
        
        <!-- Preview Gambar -->
        <div id="previewContainer" class="hidden mt-2 relative">
          <img id="imagePreview" class="w-full max-h-48 object-contain rounded border border-slate-700 bg-black/40">
          <button onclick="clearImage()" class="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded shadow">Hapus</button>
        </div>
      </div>

      <!-- Tombol Kirim Analisis -->
      <button id="btnSubmit" onclick="submitAnalysis()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-lg transition-colors text-white text-sm shadow">
        Kirim & Analisis
      </button>
    </section>

    <!-- Hasil Keputusan Terakhir (Tanpa Banjir Angka) -->
    <section id="resultCard" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2">
      <div class="flex items-center justify-between pb-2 border-b border-slate-700">
        <span id="resTicker" class="text-sm font-bold text-white tracking-wider">BBCA</span>
        <span id="resStatus" class="px-2.5 py-0.5 rounded text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">WAITING</span>
      </div>
      <div class="space-y-1.5 text-xs">
        <p><strong class="text-slate-400">Bandarmologi:</strong> <span id="resBandar" class="text-slate-200">-</span></p>
        <p><strong class="text-slate-400">Instruksi Aksi:</strong> <span id="resAksi" class="text-white font-medium">-</span></p>
        <div class="flex justify-between pt-1 text-slate-300">
          <span>Target TP: <strong id="resTP" class="text-emerald-400">-</strong></span>
          <span>Cut Loss (CL): <strong id="resCL" class="text-rose-400">-</strong></span>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Konfigurasi Webhook n8n & Topik Notifikasi ntfy
    const N8N_WEBHOOK_URL = "https://YOUR_N8N_DOMAIN/webhook/stock-analyze";
    const NTFY_TOPIC = "stock-alert-" + Math.floor(1000 + Math.random() * 9000); // Ganti dengan nama topik privat Anda
    let selectedTicker = "BBCA";
    let base64Image = null;

    // 1. Pemilihan Ticker
    function selectTicker(ticker) {
      selectedTicker = ticker;
      document.querySelectorAll('.ticker-btn').forEach(btn => {
        if(btn.innerText === ticker) {
          btn.className = "ticker-btn py-1.5 text-sm font-semibold rounded bg-blue-600 text-white";
        } else {
          btn.className = "ticker-btn py-1.5 text-sm font-semibold rounded bg-slate-700 hover:bg-slate-600";
        }
      });
    }

    // 2. Fitur Paste Langsung (Ctrl + V)
    window.addEventListener('paste', e => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          handleImageFile(blob);
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      if (e.target.files && e.target.files[0]) handleImageFile(e.target.files[0]);
    };

    function handleImageFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result;
        document.getElementById('imagePreview').src = base64Image;
        document.getElementById('previewContainer').classList.remove('hidden');
        dropZone.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      base64Image = null;
      document.getElementById('previewContainer').classList.add('hidden');
      dropZone.classList.remove('hidden');
      fileInput.value = "";
    }

    // 3. Web Push Notification (ntfy.sh background worker)
    function enablePush() {
      if (!("Notification" in window)) {
        alert("Browser tidak mendukung notifikasi desktop.");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          document.getElementById('notifDot').className = "w-2 h-2 rounded-full bg-emerald-500";
          document.getElementById('notifText').innerText = "Notifikasi: Aktif";
          // Sambungkan SSE ke ntfy untuk mendengarkan pesan dari n8n
          const eventSource = new EventSource(`https://ntfy.sh/${NTFY_TOPIC}/sse`);
          eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.event === "message") {
              new Notification(data.title || "Stock Alert", {
                body: data.message,
                icon: "https://stockbit.com/favicon.ico"
              });
            }
          };
        }
      });
    }

    // 4. Kirim Payload ke n8n
    async function submitAnalysis() {
      if (!base64Image) {
        alert("Tempelkan (Ctrl+V) atau pilih gambar screenshot terlebih dahulu.");
        return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Menganalisis (3-5 detik)...";

      try {
        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ticker: selectedTicker,
            ntfy_topic: NTFY_TOPIC,
            image_base64: base64Image.split(',')[1]
          })
        });

        const resData = await response.json();
        
        // Tampilkan hasil di kartu web
        document.getElementById('resultCard').classList.remove('hidden');
        document.getElementById('resTicker').innerText = resData.ticker || selectedTicker;
        document.getElementById('resStatus').innerText = resData.status || "NETRAL";
        document.getElementById('resBandar').innerText = resData.bandarmologi || "-";
        document.getElementById('resAksi').innerText = resData.aksi || "-";
        document.getElementById('resTP').innerText = resData.tp || "-";
        document.getElementById('resCL').innerText = resData.cl || "-";
        
      } catch (err) {
        console.error(err);
        alert("Berhasil dikirim ke n8n. Notifikasi akan muncul saat analisis selesai.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Kirim & Analisis";
      }
    }
  </script>
</body>
</html>
